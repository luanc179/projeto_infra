apiVersion: 1

datasources:
  - name: Zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    # Dentro da rede do Docker, o Grafana fala direto com o Zabbix Web (sem passar pelo Nginx)
    url: http://zabbix-web:8080/api_jsonrpc.php
    isDefault: true
    editable: false
    jsonData:
      username: ${ZABBIX_ADMIN_USER}
      trends: true
      trendsFrom: "7d"
      trendsRange: "4d"
      cacheTTL: "1h"
      timeout: 30
    secureJsonData:
      password: ${ZABBIX_ADMIN_PASSWORD}
