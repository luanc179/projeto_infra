# Proxy reverso do laboratório
#   host:8080 -> Zabbix Web (zabbix-web:8080)
#   host:3000 -> Grafana    (grafana:3000)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream zabbix_web {
    server zabbix-web:8080;
}

upstream grafana_app {
    server grafana:3000;
}

# --- Zabbix ---
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://zabbix_web;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

# --- Grafana (inclui suporte a WebSocket para o Grafana Live) ---
server {
    listen 3000;
    server_name _;

    location / {
        proxy_pass http://grafana_app;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
